name: Documentation checks

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  spelling:
    name: Spelling check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: docs/requirements.txt

      - name: Run spell checker
        run: |
          make spelling

  linkcheck:
    name: Link check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: docs/requirements.txt

      - name: Run link check
        run: |
          make linkcheck

  inclusive-language:
    name: Inclusive language check
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: docs/requirements.txt

      - name: Run inclusive language check
        run: |
          make woke
